services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: galaxy_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - MODEL_NAME=resnet50
      - MODEL_PATH=/app/models/baseline_resnet50_best.pth

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: galaxy_frontend
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data:/app/data:ro
    environment:
      - API_BASE_URL=http://api:8000
