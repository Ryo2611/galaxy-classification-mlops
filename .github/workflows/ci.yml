name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check app src tests

      - name: Run tests
        run: |
          pytest tests/ -q

      - name: Build API image
        run: |
          docker build -f Dockerfile.api -t galaxy-api:ci .

      - name: Build frontend image
        run: |
          docker build -f Dockerfile.frontend -t galaxy-frontend:ci .
